# Builds the Antora documentation site from src/docs and publishes
# it to GitHub Pages.
#
# Enable once in the repository settings: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions". The site is then
# served from https://bovinemagnet.github.io/dart_accuraterip/.
#
# Pull requests build the site but do not deploy, so a broken xref
# or a missing page fails the check before it reaches main.
#
# Author: Paul Snow
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/docs/**'
      - 'antora-playbook.yml'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/docs/**'
      - 'antora-playbook.yml'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# The build (which also runs for pull requests) only needs to read
# the repository. The Pages permissions are granted to the deploy
# job alone, below.
permissions:
  contents: read

jobs:
  build:
    name: Build Antora site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Antora reads the working tree via `branches: HEAD`, but a
          # full clone keeps edit_url and any future versioned
          # branches working.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci installs exactly what package-lock.json records, so a
      # new upstream release cannot change the site without a commit.
      - name: Install the Antora toolchain
        run: npm ci

      # --fetch ignores any cached copy of the content and UI bundle;
      # --log-failure-level=error turns a broken xref or a missing
      # include into a failed check instead of a warning nobody reads.
      # The playbook itself carries the forgiving local defaults.
      - name: Build the site
        run: npx antora --fetch --log-failure-level=error antora-playbook.yml

      - name: Upload the Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    # Only main deploys; pull requests (and manual runs on other
    # branches) stop after the build check.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Publish to Pages using the OIDC token.
    permissions:
      pages: write
      id-token: write
    # Never run two deployments at once; queue instead of cancelling
    # so a half-published site is not left behind. Scoped to this
    # job so pull-request builds never join the group: GitHub keeps
    # only one pending run per group, and a PR build queued there
    # would silently replace a pending main deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
